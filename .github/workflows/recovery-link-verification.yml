name: Verify recovery link fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        revision: [base, fix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Recovery tests
        if: matrix.revision == 'fix'
        run: npm test -- --runInBand src/lib/__tests__/recoveryLink.test.ts src/lib/__tests__/passwordRecovery.test.ts
      - name: Full suite
        if: always()
        run: npm test -- --runInBand
