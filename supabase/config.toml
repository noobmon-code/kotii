# Supabase CLI: `supabase link`, `supabase db push`, `supabase functions deploy`.
project_id = "kotii"

# verify_jwt: a plataforma só deixa passar quem traz um token (o app manda o
# da pessoa). As chamadas do pg_cron não mandam chave do Supabase, só o
# segredo do agendamento, que a própria função confere: nelas fica desligado.

[functions.parse-receipt]
verify_jwt = true

[functions.nuke]
verify_jwt = true

[functions.leave-household]
# O app chama com o token da pessoa (a função confere com auth.getUser); o
# pg_cron (request_household_file_cleanup), com o segredo x-cleanup-secret.
verify_jwt = false

[functions.nfce]
verify_jwt = true

[functions.send-push]
# Só o pg_cron chama (request_push_send), com o segredo x-push-secret.
verify_jwt = false

[functions.finance]
# Consultor financeiro (beta): sincroniza os bancos da Pluggy.
verify_jwt = true

[functions.nuke-finance]
# Conversa com o consultor financeiro (beta), só pela API da Anthropic.
verify_jwt = true
